name: Daily LinkedIn Post

on:
  # Reliable daily trigger: an external scheduler (e.g. cron-job.org) fires this
  # via the GitHub API — unlike `schedule:`, it runs within seconds, every day.
  repository_dispatch:
    types: [daily-post]
  # Kept as a best-effort backup and for manual runs.
  schedule:
    - cron: '17 9 * * *'   # 14:17 PKT (UTC+5) — off-peak, backup only
  workflow_dispatch: {}

permissions:
  contents: write   # allows committing post_history.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python post_to_linkedin.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      - name: Persist post history (so hooks never repeat across days)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          git commit -m "chore: log day post history [skip ci]" || echo "nothing to commit"
          git push || echo "push failed (non-fatal)"
