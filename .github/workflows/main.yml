name: Daily LinkedIn Post

on:
  # Reliable daily trigger: an external scheduler (e.g. cron-job.org) fires this
  # via the GitHub API — unlike `schedule:`, it runs within seconds, every day.
  repository_dispatch:
    types: [daily-post]
  # Kept as a best-effort backup and for manual runs.
  schedule:
    - cron: '17 9 * * *'   # 14:17 PKT (UTC+5) — off-peak, backup only
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python post_to_linkedin.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
